name: Generate M3U Playlist Daily

on:
  schedule:
    - cron: '0 3 * * *'  # täglich 03:00 UTC
  workflow_dispatch:

jobs:
  fetch-m3u:
    runs-on: ubuntu-latest
    env:
      INPUT_M3U_URL: "https://github.com/jbkunama1/hAI.iptv_List/blob/main/dach-legal.m3u"  # ersetze später

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U playlist
        run: |
          wget -qO playlist.m3u "${INPUT_M3U_URL}"

      - name: Check if m3u changed
        id: changed
        run: |
          if git diff --quiet playlist.m3u; then
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changed.outputs.CHANGED == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add playlist.m3u
          git commit -m "Updated playlist.m3u $(date --iso-8601=minutes)"
          git push
